---
layout: default
title: News
---

<section class="card">
  <h2 class="updates-title">Latest Updates</h2>
  {% assign updates = site.updates | sort: "date" | reverse %}
  <div class="updates-list">
    {% for item in updates limit:5 %}
    <div class="update-item">
      <p>
        <span class="update-date">{{ item.date | date: "%d %b %Y:" }}</span>
        <a href="{{ item.url | relative_url }}" class="update-title">
          {{ item.title }}
        </a>
      </p>
    </div>
    {% endfor %}
  </div>
  
  <div class="updates-more">
    <a href="{{ '/news.html' | relative_url }}" class="more-button">
      Read more →
    </a>
  </div>
</section>
