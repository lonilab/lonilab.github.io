---
layout: default
title: News
---

{% assign news = site.updates | sort: "date" | reverse %}

<section class="news">
  <div class="news-list">
    {% for item in news %}
      <article class="news-card">

        <h2 class="news-heading">
          <span class="news-date">
            {{ item.date | date: "%d %b %Y" }}
          </span>
          <span class="news-title">
            {{ item.title }}
          </span>
        </h2>

        {% if item.content %}
          <div class="news-description" data-collapsed="true">
            {{ item.content | markdownify }}
          </div>

          <button class="toggle-btn" type="button">Show more</button>
        {% endif %}

      </article>
    {% endfor %}
  </div>
</section>
